<main class="hero-section">
  <div class="content-left">
    <h1> {{ 'STARTPAGE.HEADLINE' | translate }} <br></h1>
    <p> {{ 'STARTPAGE.DESCRIPTION' | translate }} </p>

    <div class="action-buttons">
      <button
        class="btn-primary"
        (click)="openCreateRoomDialog()">
        {{ 'STARTPAGE.CREATE_ROOM_BUTTON' | translate }}
      </button>
      <button
        class="btn-secondary"
        (click)="openJoinRoomDialog()">
        {{ 'STARTPAGE.JOIN_ROOM_BUTTON' | translate }}
      </button>
    </div>
  </div>

  <div class="content-right">
    <div class="cards-cluster">
      <div class="card-grid">
        @for (card of estimationCards; track $index) {
        <div class="poker-card" [class]="'card-pos-' + $index">
          {{ card }}
        </div>
        }
      </div>
    </div>
  </div>
</main>
