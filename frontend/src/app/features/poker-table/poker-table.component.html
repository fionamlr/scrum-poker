@if (currentRoomData()) {
  <div class="poker-view">

    <main class="poker-view__main">
      <header class="poker-view__header">
        <h1>{{ currentRoomData()!.roomName }}</h1>
        <span class="badge">Moderator: {{ currentRoomData()!.creatorName }}</span>
      </header>

      <!-- TODO: Hier kommt spaeter der Bereich hin, wo die aufgedeckten Karten liegen -->
      <div class="poker-view__board-placeholder">
        {{ 'POKER_TABLE.WAITING_HINT' | translate }}
      </div>

      <div class="poker-view__deck">
        <app-card-deck
          [cards]="estimationCards"
          [selectedCard]="selectedCard()"
          (cardSelected)="selectCard($event)">
        </app-card-deck>

        <button
          class="poker-view__submit-button"
          [disabled]="selectedCard() === null"
          (click)="lockInCard()">
          {{ 'POKER_TABLE.BUTTON_SELECT_CARD' | translate }}
        </button>
      </div>
    </main>

    <aside class="poker-view__sidebar">
      <app-player-list [players]="currentRoomData()?.playerList ?? []"></app-player-list>
    </aside>

  </div>
} @else {
  <p> {{ 'POKER_TABLE.LOADING_ROOMDATA' | translate }} </p>
}
