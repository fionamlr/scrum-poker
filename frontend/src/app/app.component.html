<div class="app-layout" [class.app-layout--dark]="isDarkMode()">

  <header class="app-layout__header">
    <div class="logo">
      <span class="logo__icon">⟨♦⟩</span>
      <span class="logo__text">Logo</span>
    </div>

    <button
      type="button"
      class="theme-toggle"
      [class.theme-toggle--dark]="isDarkMode()"
      (click)="toggleTheme()">
      <span class="theme-toggle__track">
        <span class="theme-toggle__icon theme-toggle__icon--sun">☀️</span>
        <span class="theme-toggle__icon theme-toggle__icon--moon">🌙</span>
        <span class="theme-toggle__knob" [class.theme-toggle__knob--active]="isDarkMode()"></span>
      </span>
    </button>
  </header>

  <main class="app-layout__content">
    <router-outlet></router-outlet>
  </main>

  <footer class="app-layout__footer">
    <div class="lang-switch">
      <button
        type="button"
        class="lang-switch__button"
        [class.lang-switch__button--active]="currentLang() === 'de'"
        (click)="switchLanguage('de')">
        DE
      </button>
      <button
        type="button"
        class="lang-switch__button"
        [class.lang-switch__button--active]="currentLang() === 'en'"
        (click)="switchLanguage('en')">
        EN
      </button>
    </div>
  </footer>

</div>
